name: Verify production game

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DUST_QA_DIR: browser-qa
      DUST_GPU_BACKEND: swiftshader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - name: Play the production build in Chromium
        run: npm run test:browser
      - name: Preserve screenshots and renderer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dust-division-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-qa/
          retention-days: 14
